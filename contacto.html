    <main>
    <section>
    <h2>Horarios de Atencion:</h2>
    <table border="1">
        <tr>
            <th>Dia</th>
            <th>Horario</th>
        </tr>
        <tr>
            <td>Lunes a Viernes</td>
            <td>12:00 pm - 10:00 pm</td>
        </tr>
        <tr>
            <td>Sabados y Domingos</td>
            <td>11:00 am - 11:00 pm</td>
        </tr>
    </table>
    </section>

    <section>
    <h2>Formulario de Reservas:</h2>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>
        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" required><br><br>
        <label for="personas">Numeros de personas:</label>
        <input type="number" id="personas" name="personas" required><br><br>
        <label for="servicio">Tipo de servicio:</label>
        <select name="servicio" id="servicio">
        <option value="Local">En el local</option>
        <option value="delivery">Delivery</option>
        </select><br><br>
        <button type="submit">Enviar Reserva</button>
    
    </form>
    </section>
